name: Pylint

# ← QUAND le workflow se déclenche (l'événement)
on: [push]          

jobs:
 # NOM choisi pour ce job
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install ./backend     
        pip install faker
    - name: Analysing the code with pylint
      run: |
         pylint --rcfile=backend/pyproject.toml --fail-under=8 backend/src
