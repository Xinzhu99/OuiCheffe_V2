server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router en mode "history" : toute route inconnue de nginx (ex: /recettes/12)
    # doit quand même renvoyer index.html pour que vue-router prenne le relais côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
